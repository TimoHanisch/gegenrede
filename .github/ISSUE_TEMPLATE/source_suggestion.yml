name: Fact-check source suggestion
description: Suggest a fact-checking source for the ingest pipeline
labels: ["area:ingest", "source-suggestion"]
body:
  - type: input
    id: organization
    attributes:
      label: Organization
      description: e.g. Correctiv, dpa-Faktencheck, AFP, BR24 Faktenfuchs
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Site URL
    validations:
      required: true
  - type: textarea
    id: machine-readable
    attributes:
      label: Machine-readable access
      description: Known RSS/Atom feed, sitemap, ClaimReview markup, or API? Links if you have them — verified URLs save a lot of work, unverified guesses don't.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - German
        - English
        - other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Licensing/terms-of-use concerns, volume, anything else relevant.
