packages:
  - packages/*
  - services/*
  - data/eval

# onnxruntime-node's postinstall fetches its native binding; without it the
# embedding integration path (services, EMBEDDING_INTEGRATION tests) cannot
# run. protobufjs and sharp stay blocked — nothing in our runtime path needs
# their build scripts.
onlyBuiltDependencies:
  - onnxruntime-node

catalog:
  "@huggingface/transformers": ^4.2.0
  "@types/node": ^25.9.2
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^10.4.1
  postgres: ^3.4.9
  tinyld: ^1.3.4
  tsx: ^4.22.4
  typescript: ^5.9.3
  vitest: ^4.1.8
  zod: ^3.25.76
